name: Build OfficeZen APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'officezen-source.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract Android project
        run: |
          if [ -f officezen-source.zip ]; then SOURCE_ZIP=officezen-source.zip; elif [ -f untitled.zip ]; then SOURCE_ZIP=untitled.zip; else echo 'Source ZIP not found'; exit 1; fi
          mkdir -p android-project
          unzip -q "$SOURCE_ZIP" -d android-project
          test -f android-project/settings.gradle.kts
          test -f android-project/app/build.gradle.kts

      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfficeZen-debug-apk
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
